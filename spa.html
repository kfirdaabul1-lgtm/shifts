<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הזמנת טיפול ספא</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EEE4;--card:#FFFDF9;--ink:#2A211C;--muted:#7C7064;--line:#E6DACA;--acc:#A8874F;--acc2:#2C221D;--gold:#C9A96A;--ok:#2f7a4f;--bad:#A3281F;--focus:#7A5A1E;--serif:'Frank Ruhl Libre',Georgia,serif}
*{box-sizing:border-box}
body{margin:0;font-family:Assistant,Arial,sans-serif;font-size:16px;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
html,body{overflow-x:hidden}
.hero{position:relative;background:radial-gradient(120% 90% at 50% 0%,#4A3A2C 0%,#2A201A 55%,#1C1511 100%);color:#F3E9D8;text-align:center;padding:46px 16px 64px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(40% 50% at 50% 10%,rgba(201,169,106,.22),transparent 70%);pointer-events:none}
.hero .eyebrow{font-family:Assistant,sans-serif;font-weight:600;font-size:12px;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
.hero h1{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1.15;margin:0;letter-spacing:.01em;color:#FBF4E6}
.hero .orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px auto 0;color:var(--gold)}.hero .orn i{display:block;width:56px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}.hero .orn b{font-size:11px;font-weight:400}
.hero p{color:#D8CBB6;margin:16px auto 0;max-width:520px;white-space:pre-wrap;font-weight:300;font-size:17px}
.wrap{position:relative;max-width:720px;margin:-36px auto 0;padding:0 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px 22px;margin-top:18px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 12px 30px -18px rgba(44,34,29,.35);animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 16px;display:flex;align-items:center;gap:12px;color:var(--acc2)}
h2 .n{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--acc);color:var(--acc);font-family:var(--serif);font-size:16px;font-weight:500;flex:none}
.items{display:grid;gap:12px}
.item{display:flex;justify-content:space-between;gap:14px;align-items:center;text-align:start;width:100%;padding:18px 18px;border:1px solid var(--line);border-radius:4px;background:#fff;font:inherit;color:inherit;cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s}
.item:hover{border-color:#D5C2A2}
.item[aria-pressed="true"]{border-color:var(--acc);background:#FBF6EC;box-shadow:0 0 0 1px var(--acc) inset}
.item b{font-family:var(--serif);font-weight:500;font-size:19px;color:var(--acc2)}.item small{color:var(--muted);display:block;font-size:14px;margin-top:2px}
.item .pr{font-family:var(--serif);font-weight:500;font-size:21px;white-space:nowrap;color:var(--acc2);text-align:center}.item .pr small{font-family:Assistant,sans-serif;font-size:12px;letter-spacing:.06em}
.item.pkg{cursor:default;display:block;background:linear-gradient(180deg,#FFFDF9,#F8F1E4)}.pkgb{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn2{display:inline-block;padding:10px 16px;border-radius:2px;border:1px solid var(--acc);color:var(--acc2);font-weight:600;font-size:14px;letter-spacing:.04em;text-decoration:none;background:transparent;font-family:inherit;cursor:pointer;transition:background .2s,color .2s}.btn2:hover{background:var(--acc2);color:#F3E9D8;border-color:var(--acc2)}.btn2.fill{background:var(--acc2);color:#F3E9D8}
.item .go{font-weight:600;white-space:nowrap;color:var(--acc)}
.reqn{background:#FBF4E6;border:1px solid #E8D6B0;border-inline-start:3px solid var(--acc);border-radius:2px;padding:10px 12px;margin:10px 0;font-size:15px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.chip{flex:none;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;color:inherit;cursor:pointer;text-align:center;min-width:70px;transition:all .2s}
.chip:hover{border-color:var(--acc)}
.chip small{display:block;color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--acc2);background:var(--acc2);color:var(--gold)}.chip[aria-pressed="true"] small{color:#D8CBB6}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px}
.muted{color:var(--muted)}
label.f{display:block;margin:12px 0}label.f span{display:block;font-weight:600;font-size:14px;letter-spacing:.02em;margin-bottom:6px;color:var(--acc2)}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],select,textarea{width:100%;padding:12px 14px;border:1px solid #D9CBB5;border-radius:3px;font:inherit;background:#fff;color:inherit;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(168,135,79,.18)}
textarea{min-height:76px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14px}.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--acc2)}
.btn{display:inline-block;width:100%;padding:16px;border:0;border-radius:3px;background:linear-gradient(180deg,#3A2E27,#241C17);color:#F3E2BF;font:inherit;font-weight:600;font-size:17px;letter-spacing:.06em;cursor:pointer;box-shadow:0 10px 24px -12px rgba(36,28,23,.7);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px -12px rgba(36,28,23,.75)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.sum{background:#FBF6EC;border:1px solid #EADCC2;border-radius:3px;padding:14px 16px;margin:14px 0;font-size:15px}.sum b{font-family:var(--serif);font-weight:500;font-size:17px}
.policy{white-space:pre-wrap;font-size:14px;color:var(--muted);background:#FAF6EF;border:1px solid var(--line);border-radius:3px;padding:12px 14px;margin:12px 0}
.err{color:var(--bad);font-weight:600;margin:8px 0}
.done{text-align:center}.done .big{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;border:1px solid var(--acc);color:var(--acc);font-size:30px;margin-bottom:6px}.done h2{justify-content:center;font-size:26px}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
footer{text-align:center;font-size:12px;color:var(--muted);margin-top:30px;letter-spacing:.02em}
@media(max-width:480px){.row{grid-template-columns:1fr}.hero h1{font-size:30px}.hero{padding:38px 16px 58px}.card{padding:20px 16px}.item{padding:16px 14px}.item b{font-size:17px}}
.hl{background:#F7F1FB;border:1px solid #E5D8F0;border-radius:3px;padding:14px 16px;margin:14px 0;text-align:start}.hlb{display:block;text-align:center;text-decoration:none;margin-top:8px}</style>
</head>
<body>
<header class="hero"><p class="eyebrow">Spa · Wellness</p><h1 id="bizName">הזמנת טיפול ספא</h1><div class="orn" aria-hidden="true"><i></i><b>✦</b><i></i></div><p id="intro"></p></header>
<div class="wrap">
  <main id="app" aria-live="polite"><div class="card"><p class="muted">טוען…</p></div></main>
  <footer>ההזמנה נשמרת אצלנו רק לצורך הטיפול. <a href="privacy.html" target="_blank" rel="noopener">מדיניות פרטיות</a></footer>
</div>
<script src="config.js"></script>
<script>
(function(){
  const cfg=window.APP_CONFIG||{},pid=(cfg.firebase||{}).projectId||'hotel-shifts',API='https://europe-west1-'+pid+'.cloudfunctions.net/spaPublic';
  const $=s=>document.querySelector(s),app=$('#app');
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ils=n=>'₪'+Math.round(n||0).toLocaleString('he-IL');
  const DOW=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
  const addD=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
  const dowOf=iso=>new Date(iso+'T12:00:00Z').getUTCDay();
  const nice=iso=>new Date(iso+'T12:00:00').toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
  let B=null,st={item:'',date:'',time:'',ppl:1,ther:['any'],slots:null,loading:false,err:'',sending:false,done:null};
  const f={name:'',phone:'',email:'',notes:'',privacy:false,marketing:false};
  // prefilled from a WhatsApp link (?n=name&p=phone)
  try{const q=new URLSearchParams(location.search);f.name=String(q.get('n')||'').slice(0,80);f.phone=String(q.get('p')||'').replace(/[^\d+ -]/g,'').slice(0,20)}catch(e){}
  async function load(){try{const r=await fetch(API);B=await r.json()}catch(e){B={err:1}}
    if(B.err||!B.on){app.innerHTML=`<div class="card"><p>${B&&B.on===false?'ההזמנה אונליין לא זמינה כרגע. אפשר להתקשר אלינו להזמנה.':'לא הצלחנו לטעון את העמוד. נסו שוב מאוחר יותר.'}</p></div>`;return}
    if(B.biz&&B.biz.name){$('#bizName').textContent=B.biz.name;document.title='הזמנת טיפול · '+B.biz.name}
    $('#intro').textContent=B.intro||'בחרו טיפול, תאריך ושעה פנויה. התשלום במקום.';
    st.ppl=1;render()}
  function openDays(){const out=[];let d=B.today;while(d<=B.last&&out.length<60){const h=(B.hours||{})[dowOf(d)]||{};if(!h.off)out.push(d);d=addD(d,1)}return out}
  async function fetchSlots(){if(!st.item||!st.date)return;st.slots=null;st.loading=true;st.time='';render();
    try{const r=await fetch(API+'?date='+encodeURIComponent(st.date)+'&item='+encodeURIComponent(st.item)+'&ther='+encodeURIComponent(therArr().join(',')));const j=await r.json();st.slots=j.slots||[]}catch(e){st.slots=[];st.err='לא הצלחנו לבדוק שעות פנויות.'}
    st.loading=false;render()}
  const tel=()=>String(B.resPhone||'').trim(),telHref=()=>'tel:'+tel().replace(/[^\d+]/g,''),telBtn=t=>tel()?`<a class="btn2" href="${esc(telHref())}" dir="auto">${t} · <span dir="ltr" style="white-space:nowrap">${esc(tel())}</span></a>`:'';
  const waN=()=>{let d=String(B.wa||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='972'+d.slice(1);return d.length>=11?d:''};
  const waOther=()=>{const it=(B.items||[]).find(x=>x.id===st.item),dt=st.oDate?nice(st.oDate):'',t=[`שלום, אשמח להזמין טיפול בספא${B.biz&&B.biz.name?' ('+B.biz.name+')':''}:`,it?`טיפול: ${it.name}`:'',`מספר אנשים: ${st.ppl}`,therTxt()?`מטפל/ת: ${therTxt()}`:'',dt?`תאריך מבוקש: ${dt}`:'',st.oTime?`שעה מבוקשת: ${st.oTime}`:'',f.name?`שם: ${f.name}`:''].filter(Boolean).join('\n');return 'https://wa.me/'+waN()+'?text='+encodeURIComponent(t)};
  const isReq=d=>!!(d&&((B.hours||{})[dowOf(d)]||{}).req);
  const supOf=(it,d)=>{if(!it||!d)return 0;const w=dowOf(d);return w===5||w===6?(+it.wk||0):0};
  const priceOf=(it,d,p)=>{const u=(+it.price||0)+supOf(it,d);return it.couple?u:u*p};
  const TH=[['any','לא משנה'],['f','מטפלת'],['m','מטפל']],THN={any:'',f:'מטפלת',m:'מטפל'};
  const therArr=()=>Array.from({length:st.ppl},(_,i)=>B.thers?(st.ther[i]||'any'):'any');
  const therTxt=()=>{const a=therArr().filter(k=>k!=='any');return a.length?a.map(k=>THN[k]).join(' + '):''};
  function render(){if(st.done)return renderDone();const it=(B.items||[]).find(x=>x.id===st.item),days=openDays(),max=Math.max(1,+B.maxPpl||1);
    let h=`<section class="card" aria-labelledby="s1"><h2 id="s1"><span class="n">1</span>בחירת טיפול</h2><div class="items">${(B.items||[]).map(x=>x.pkg?`<div class="item pkg"><span><b>🏨 ${esc(x.name)}</b><small>חבילת טיפול עם לינה${x.desc?' · '+esc(x.desc):''}${x.price?' · '+ils(x.price):''}</small><span class="pkgb">${/^https:\/\//.test(x.url||'')?`<a class="btn2" href="${esc(x.url)}" target="_blank" rel="noopener">להזמנה באתר ←</a>`:''}${telBtn('📞 להזמנה טלפונית')}</span></span></div>`:`<button type="button" class="item" data-item="${esc(x.id)}" aria-pressed="${x.id===st.item}"><span><b>${esc(x.name)}${x.couple?' · 👥 זוגי':''}</b><small>${x.mins} דקות${x.desc?' · '+esc(x.desc):''}${x.wk?' · שישי ושבת +'+ils(x.wk):''}</small></span><span class="pr">${ils(x.price)}<small style="font-weight:400">${x.couple?'לזוג':'לאדם'}</small></span></button>`).join('')||'<p class="muted">אין כרגע טיפולים להזמנה אונליין.</p>'}</div>
      ${it&&!it.couple&&max>1?`<label class="f"><span>כמה אנשים</span><select id="ppl">${Array.from({length:max},(_,i)=>`<option value="${i+1}" ${st.ppl===i+1?'selected':''}>${i+1}</option>`).join('')}</select></label>`:''}
      ${it&&B.thers?`<div class="f" style="margin-top:10px"><span style="display:block;font-weight:500;margin-bottom:4px">מטפל או מטפלת?</span>${Array.from({length:st.ppl},(_,i)=>`<div style="display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap">${st.ppl>1?`<span class="muted" style="min-width:52px">אורח/ת ${i+1}</span>`:''}<div class="chips" role="group" aria-label="${st.ppl>1?'אורח '+(i+1)+': ':''}מטפל או מטפלת" style="padding:0">${TH.map(([k,n])=>`<button type="button" class="chip" data-ther="${i}|${k}" aria-pressed="${(st.ther[i]||'any')===k}">${n}</button>`).join('')}</div></div>`).join('')}<p class="muted" style="font-size:13px;margin:4px 0 0">השעות שמוצגות הן רק כשיש ${st.ppl>1?'מטפלים':'מטפל/ת'} פנוי${st.ppl>1?'ים':'/ה'} במשמרת.</p></div>`:''}</section>`;
    if(it)h+=`<section class="card" aria-labelledby="s2"><h2 id="s2"><span class="n">2</span>תאריך</h2><div class="chips" role="group" aria-label="תאריכים">${waN()?`<button type="button" class="chip" data-other="1" aria-pressed="${!!st.other}">📅 תאריך אחר<small>בוואטסאפ</small></button>`:''}${days.map(d=>`<button type="button" class="chip" data-date="${d}" aria-pressed="${d===st.date}" aria-label="${esc(nice(d))}">${DOW[dowOf(d)]}<small>${d.slice(8,10)}.${d.slice(5,7)}</small></button>`).join('')}</div>
      ${st.other?`<div class="reqn"><b>בקשה לתאריך ושעה אחרים</b><p style="margin:4px 0 8px">בחרו מתי הייתם רוצים, ונמשיך בוואטסאפ לבדוק זמינות ולסגור את ההזמנה.</p><div class="row"><label class="f"><span>תאריך מבוקש</span><input type="date" id="o_date" min="${esc(B.today||'')}" value="${esc(st.oDate||'')}"></label><label class="f"><span>שעה מבוקשת</span><input type="time" id="o_time" step="900" style="width:100%" value="${esc(st.oTime||'')}"></label></div><button type="button" class="btn" id="owa" style="background:linear-gradient(180deg,#1F8A4C,#16703C);color:#fff">💬 המשך בוואטסאפ</button></div>`:''}</section>`;
    if(it&&st.date)h+=`<section class="card" aria-labelledby="s3"><h2 id="s3"><span class="n">3</span>שעה · ${esc(nice(st.date))}</h2>${isReq(st.date)?'<div class="reqn">⏳ ביום הזה ההזמנה נשלחת כבקשה, והספא יחזור אליכם לאישור הזמינות.</div>':''}${st.loading?'<p class="muted">בודקים שעות פנויות…</p>':!st.slots||!st.slots.length?`<p class="muted">אין שעה פנויה עם מטפל/ת ביום הזה לטיפול שבחרתם. נסו יום אחר${tel()?', או התקשרו למחלקת ההזמנות ונמצא לכם מועד':''}.</p><span class="pkgb">${waN()?'<button type="button" class="btn2" data-other2="1">💬 בקשה לשעה אחרת בוואטסאפ</button>':''}${telBtn('📞 התקשרו למחלקת הזמנות')}</span>`:`<div class="times" role="group" aria-label="שעות פנויות">${st.slots.map(t=>`<button type="button" class="chip" data-time="${t}" aria-pressed="${t===st.time}">${t}</button>`).join('')}</div>${tel()?`<p class="muted" style="font-size:14px;margin:10px 0 0">רוצים שעה אחרת שלא מופיעה כאן? התקשרו למחלקת ההזמנות: <a href="${esc(telHref())}" dir="ltr">${esc(tel())}</a></p>`:''}${waN()?'<button type="button" class="btn2" data-other2="1" style="margin-top:8px">💬 בקשה לשעה אחרת בוואטסאפ</button>':''}`}</section>`;
    if(it&&st.date&&st.time)h+=`<section class="card" aria-labelledby="s4"><h2 id="s4"><span class="n">4</span>פרטים ואישור</h2>
      <div class="sum"><b>${esc(it.name)}</b> · ${it.mins} דק׳${st.ppl>1?' · '+st.ppl+' אנשים':''}${therTxt()?' · '+therTxt():''}<br>${esc(nice(st.date))} בשעה ${st.time}<br>סה״כ לתשלום במקום: <b>${ils(priceOf(it,st.date,st.ppl))}</b>${supOf(it,st.date)?` <small class="muted">(כולל תוספת שישי ושבת)</small>`:''}</div>
      <form id="frm" novalidate><div class="row"><label class="f"><span>שם מלא *</span><input type="text" id="f_name" autocomplete="name" required value="${esc(f.name)}"></label><label class="f"><span>טלפון *</span><input type="tel" id="f_phone" autocomplete="tel" dir="ltr" inputmode="tel" required value="${esc(f.phone)}"></label></div>
      <label class="f"><span>אימייל (לא חובה)</span><input type="email" id="f_email" autocomplete="email" dir="ltr" value="${esc(f.email)}"></label>
      <label class="f"><span>הערות (לא חובה)</span><textarea id="f_notes" placeholder="למשל: מעדיפים מטפלת">${esc(f.notes)}</textarea></label>
      <div class="hp" aria-hidden="true"><label>אתר<input type="text" id="f_web" tabindex="-1" autocomplete="off"></label></div>
      ${B.policy?`<div class="policy"><b>תנאי ההזמנה</b>\n${esc(B.policy)}</div>`:''}
      <label class="check"><input type="checkbox" id="f_priv" ${f.privacy?'checked':''}><span>קראתי ואני מסכים/ה ל<a href="privacy.html" target="_blank" rel="noopener">מדיניות הפרטיות</a>${B.policy?' ולתנאי ההזמנה':''}. הפרטים משמשים רק לתיאום הטיפול. *</span></label>
      <label class="check"><input type="checkbox" id="f_mkt" ${f.marketing?'checked':''}><span>אשמח לקבל הטבות ועדכונים (לא חובה)</span></label>
      ${st.err?`<p class="err" role="alert">${esc(st.err)}</p>`:''}
      <button class="btn" type="submit" ${st.sending?'disabled':''}>${st.sending?'שולחים…':isReq(st.date)?'שליחת בקשה להזמנה':'אישור ההזמנה'}</button></form></section>`;
    else if(st.err)h+=`<p class="err" role="alert">${esc(st.err)}</p>`;
    app.innerHTML=h}
  const hlUrl=k=>{const u=new URL('health.html',location.href);u.search='?k='+k;const c=(window.APP_CONFIG||{}).chainId,f=((window.SC_CHAINS||[])[0]||{}).id;if(c&&f&&c!==f)u.search+='&chain='+encodeURIComponent(c);return u.href};
  function renderDone(){const d=st.done;app.innerHTML=`<div class="card done"><div class="big" aria-hidden="true">✓</div><h2 style="justify-content:center">${d.req?'הבקשה נשלחה!':'ההזמנה התקבלה!'}</h2>${d.req?'<div class="reqn">⏳ הספא יבדוק זמינות ויחזור אליכם לאישור (בדרך כלל בוואטסאפ).</div>':''}
    <p><b>${esc(d.item)}</b> · ${d.mins} דק׳${d.people>1?' · '+d.people+' אנשים':''}<br>${esc(nice(d.date))} בשעה ${esc(d.time)}<br>לתשלום במקום: <b>${ils(d.total)}</b></p>
    ${(d.health||[]).length?`<div class="hl"><b>⚕️ שלב אחרון: הצהרת בריאות</b><p style="margin:4px 0 8px">אי אפשר לקבל את הטיפול בלי הצהרת בריאות חתומה. נא למלא עכשיו (לוקח דקה)${d.health.length>1?' — טופס לכל אחד מהמטופלים':''}:</p>${d.health.map((k,i)=>`<a class="btn hlb" href="${esc(hlUrl(k))}" target="_blank" rel="noopener">${d.health.length>1?'הצהרת בריאות · אדם '+(i+1):'מילוי הצהרת בריאות'}</a>`).join('')}</div>`:''}
    <p class="muted">נשמח לראותכם. אם צריך לשנות או לבטל${B.biz&&B.biz.phone?`, התקשרו אלינו: <a href="tel:${esc(B.biz.phone)}" dir="ltr">${esc(B.biz.phone)}</a>`:', צרו איתנו קשר'}.</p></div>`;app.querySelector('h2').focus&&app.querySelector('h2').setAttribute('tabindex','-1');app.querySelector('h2').focus()}
  function keep(){const v=id=>{const e=document.getElementById(id);return e?e:null};if(v('f_name')){f.name=v('f_name').value;f.phone=v('f_phone').value;f.email=v('f_email').value;f.notes=v('f_notes').value;f.privacy=v('f_priv').checked;f.marketing=v('f_mkt').checked}}
  app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.type==='submit')return;keep();st.err='';
    if(b.dataset.item){const was=(B.items||[]).find(x=>x.id===st.item),nx=(B.items||[]).find(x=>x.id===b.dataset.item);st.item=b.dataset.item;st.time='';if(nx&&nx.couple)st.ppl=2;else if(was&&was.couple)st.ppl=1;st.ther=Array.from({length:st.ppl},(_,i)=>st.ther[i]||'any');if(st.date)fetchSlots();else render()}
    else if(b.dataset.other2){st.oDate=st.date;st.other=true;st.date='';st.time='';render();setTimeout(()=>{const s2=document.getElementById('s2');s2&&s2.scrollIntoView({behavior:'smooth',block:'start'})},50)}
    else if(b.dataset.other){st.other=!st.other;if(st.other){st.date='';st.time=''}render()}
    else if(b.id==='owa'){const d=document.getElementById('o_date'),t=document.getElementById('o_time');st.oDate=d?d.value:'';st.oTime=t?t.value:'';window.open(waOther(),'_blank','noopener')}
    else if(b.dataset.date){st.date=b.dataset.date;st.other=false;fetchSlots()}
    else if(b.dataset.ther){const [i,k]=b.dataset.ther.split('|');st.ther[+i]=k;st.time='';if(st.date)fetchSlots();else render()}
    else if(b.dataset.time){st.time=b.dataset.time;render();setTimeout(()=>{const s=document.getElementById('s4');s&&s.scrollIntoView({behavior:'smooth',block:'start'})},50)}});
  app.addEventListener('change',e=>{if(e.target.id==='ppl'){keep();st.ppl=+e.target.value||1;st.ther=Array.from({length:st.ppl},(_,i)=>st.ther[i]||'any');st.time='';if(st.date)fetchSlots();else render()}});
  app.addEventListener('submit',async e=>{e.preventDefault();keep();st.err='';
    if(f.name.trim().length<2){st.err='צריך למלא שם מלא';render();return}
    if(f.phone.replace(/\D/g,'').length<9){st.err='צריך מספר טלפון תקין';render();return}
    if(!f.privacy){st.err='צריך לאשר את מדיניות הפרטיות';render();return}
    st.sending=true;render();
    try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item:st.item,date:st.date,time:st.time,people:st.ppl,ther:therArr(),name:f.name,phone:f.phone,email:f.email,notes:f.notes,privacy:f.privacy,marketing:f.marketing,website:(document.getElementById('f_web')||{}).value||''})});
      const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){st.sending=false;st.err=j.error||'ההזמנה לא נשלחה. נסו שוב.';if(r.status===409){st.time='';fetchSlots()}render();return}
      st.done=j;render()}catch(err){st.sending=false;st.err='אין חיבור לאינטרנט. נסו שוב.';render()}});
  load();
})();
</script>
</body>
</html>
