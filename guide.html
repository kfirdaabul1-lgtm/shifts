<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group guide</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E7;--card:#FFFDF8;--ink:#1B2336;--muted:#6B6457;--line:#E4DBC8;--navy:#14213D;--gold:#B08D57;--ok:#1F7A4D;--okb:#E3F3EA;--warn:#9A5B00;--warnb:#FFF1D6;--bad:#B3261E;--badb:#FBE4E2;--busy:#1D4ED8;--busyb:#E3ECFF;--grey:#555;--greyb:#ECEAE6}
@media (prefers-color-scheme:dark){:root{--bg:#0E1626;--card:#16213A;--ink:#EEE8DC;--muted:#A9A190;--line:#2A3858;--okb:#14382A;--warnb:#3A2B10;--badb:#3D1715;--busyb:#172A55;--greyb:#2A2F3A;--ok:#6FD3A0;--warn:#F5C26B;--bad:#FF8A80;--busy:#93B4FF;--grey:#C9C4BA}}
*{box-sizing:border-box}
body{margin:0;font-family:Assistant,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px}
.top{background:var(--navy);color:#F6F1E7;padding:18px 16px 16px}
.top .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.top h1{font-family:'Frank Ruhl Libre',serif;font-size:26px;margin:0;line-height:1.2}
.top p{margin:4px 0 0;color:#D9CDB4;font-size:14px}
.top select{background:transparent;color:#F6F1E7;border:1px solid var(--gold);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px}
.top select option{color:#1B2336}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}
h2{font-family:'Frank Ruhl Libre',serif;font-size:20px;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 small{font-family:Assistant,Arial,sans-serif;font-size:14px;color:var(--muted);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;border-top:3px solid var(--gold)}
.kpi b{display:block;font-size:22px;font-family:'Frank Ruhl Libre',serif}.kpi span{font-size:13px;color:var(--muted)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.room{border-radius:8px;padding:8px 10px;border:1px solid var(--line)}
.room b{display:block;font-size:18px}.room span{font-size:13px;font-weight:600}.room small{display:block;font-size:12px;opacity:.8}
.s-clean{background:var(--okb);color:var(--ok);border-color:transparent}
.s-ready{background:var(--okb);color:var(--ok);border-color:transparent;opacity:.85}
.s-busy{background:var(--busyb);color:var(--busy);border-color:transparent}
.s-wait{background:var(--warnb);color:var(--warn);border-color:transparent}
.s-dnd,.s-oos{background:var(--greyb);color:var(--grey);border-color:transparent}
.s-fault{background:var(--badb);color:var(--bad);border-color:transparent}
.list{display:grid;gap:8px}
.row{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.row b{display:block}.row small{color:var(--muted)}
.day{font-weight:700;margin:10px 0 4px;color:var(--muted);font-size:14px}
.msg{border-inline-start:4px solid var(--gold);background:var(--card);border-radius:8px;padding:10px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line)}
.msg p{margin:0;white-space:pre-wrap}.msg small{color:var(--muted);display:block;margin-top:4px}
.msg.new{box-shadow:0 0 0 2px var(--gold)}
.muted{color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
button.ref{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.err{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;text-align:center;margin-top:30px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="in"><div><h1 id="t">…</h1><p id="st"></p></div>
<label><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Language</span><select id="lang" aria-label="Language">
<option value="he">עברית</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="ru">Русский</option></select></label></div></header>
<main class="wrap" id="main" aria-live="polite"><p class="muted">…</p></main>
<script src="config.js"></script>
<script>
(function(){
const T={
he:{title:'עמוד מדריך הקבוצה',rooms:'החדרים של הקבוצה',cleaned:'נוקו היום',busy:'בניקיון עכשיו',wait:'ממתינים לניקיון',total:'חדרים',st_clean:'נוקה היום',st_ready:'נקי',st_busy:'בניקיון',st_wait:'ממתין לניקיון',st_dnd:'שלט "נא לא להפריע"',st_fault:'תקלה בטיפול',st_oos:'לא בשימוש',halls:'אולמות וחללים',nohalls:'אין אולמות מתוכננים.',msgs:'הודעות מהקבלה',nomsgs:'עדיין אין הודעות.',norooms:'הקבלה עוד לא שייכה חדרים לקבוצה.',people:'אנשים',upd:'עודכן',refresh:'רענון',bad:'הקישור לא תקין.',badp:'כדאי לבקש מהקבלה קישור חדש.',exp:'הקישור פעיל רק בזמן השהות של הקבוצה.',err:'לא הצלחנו לטעון. בודקים את החיבור ומנסים שוב.',stay:'שהות',today:'היום',at:'ב-'},
en:{title:'Group guide page',rooms:'Your group\'s rooms',cleaned:'Cleaned today',busy:'Being cleaned',wait:'Waiting',total:'Rooms',st_clean:'Cleaned today',st_ready:'Clean',st_busy:'Being cleaned',st_wait:'Waiting for cleaning',st_dnd:'"Do not disturb" sign',st_fault:'Being repaired',st_oos:'Not in use',halls:'Halls and spaces',nohalls:'No halls booked.',msgs:'Messages from reception',nomsgs:'No messages yet.',norooms:'Reception has not assigned rooms to the group yet.',people:'people',upd:'Updated',refresh:'Refresh',bad:'This link is not valid.',badp:'Please ask reception for a new link.',exp:'This link works only during the group\'s stay.',err:'Could not load. Check the connection and try again.',stay:'Stay',today:'Today',at:'at '},
es:{title:'Página del guía del grupo',rooms:'Habitaciones del grupo',cleaned:'Limpiadas hoy',busy:'Limpiándose',wait:'En espera',total:'Habitaciones',st_clean:'Limpiada hoy',st_ready:'Limpia',st_busy:'Limpiándose',st_wait:'Esperando limpieza',st_dnd:'Cartel "No molestar"',st_fault:'En reparación',st_oos:'Fuera de uso',halls:'Salones y espacios',nohalls:'No hay salones reservados.',msgs:'Mensajes de recepción',nomsgs:'Todavía no hay mensajes.',norooms:'Recepción aún no asignó habitaciones al grupo.',people:'personas',upd:'Actualizado',refresh:'Actualizar',bad:'Este enlace no es válido.',badp:'Pida un enlace nuevo en recepción.',exp:'El enlace funciona solo durante la estancia del grupo.',err:'No se pudo cargar. Compruebe la conexión e inténtelo de nuevo.',stay:'Estancia',today:'Hoy',at:'a las '},
fr:{title:'Page du guide du groupe',rooms:'Chambres du groupe',cleaned:'Nettoyées aujourd\'hui',busy:'En cours',wait:'En attente',total:'Chambres',st_clean:'Nettoyée aujourd\'hui',st_ready:'Propre',st_busy:'En nettoyage',st_wait:'En attente de ménage',st_dnd:'Panneau « Ne pas déranger »',st_fault:'En réparation',st_oos:'Hors service',halls:'Salles et espaces',nohalls:'Aucune salle réservée.',msgs:'Messages de la réception',nomsgs:'Pas encore de messages.',norooms:'La réception n\'a pas encore attribué de chambres au groupe.',people:'personnes',upd:'Mis à jour',refresh:'Actualiser',bad:'Ce lien n\'est pas valide.',badp:'Demandez un nouveau lien à la réception.',exp:'Ce lien ne fonctionne que pendant le séjour du groupe.',err:'Chargement impossible. Vérifiez la connexion et réessayez.',stay:'Séjour',today:'Aujourd\'hui',at:'à '},
de:{title:'Seite der Reiseleitung',rooms:'Zimmer der Gruppe',cleaned:'Heute gereinigt',busy:'Wird gereinigt',wait:'Wartet',total:'Zimmer',st_clean:'Heute gereinigt',st_ready:'Sauber',st_busy:'Wird gereinigt',st_wait:'Wartet auf Reinigung',st_dnd:'„Bitte nicht stören"-Schild',st_fault:'Wird repariert',st_oos:'Nicht in Betrieb',halls:'Säle und Räume',nohalls:'Keine Säle gebucht.',msgs:'Nachrichten der Rezeption',nomsgs:'Noch keine Nachrichten.',norooms:'Die Rezeption hat der Gruppe noch keine Zimmer zugeordnet.',people:'Personen',upd:'Aktualisiert',refresh:'Aktualisieren',bad:'Dieser Link ist ungültig.',badp:'Bitte an der Rezeption nach einem neuen Link fragen.',exp:'Der Link gilt nur während des Aufenthalts der Gruppe.',err:'Laden fehlgeschlagen. Verbindung prüfen und erneut versuchen.',stay:'Aufenthalt',today:'Heute',at:'um '},
ru:{title:'Страница гида группы',rooms:'Номера группы',cleaned:'Убраны сегодня',busy:'Убираются',wait:'Ждут уборки',total:'Номеров',st_clean:'Убран сегодня',st_ready:'Чистый',st_busy:'Идёт уборка',st_wait:'Ждёт уборки',st_dnd:'Табличка «Не беспокоить»',st_fault:'Ремонтируется',st_oos:'Не используется',halls:'Залы и помещения',nohalls:'Залы не забронированы.',msgs:'Сообщения от ресепшена',nomsgs:'Сообщений пока нет.',norooms:'Ресепшен ещё не назначил номера группе.',people:'чел.',upd:'Обновлено',refresh:'Обновить',bad:'Ссылка недействительна.',badp:'Попросите на ресепшене новую ссылку.',exp:'Ссылка действует только во время проживания группы.',err:'Не удалось загрузить. Проверьте соединение и попробуйте снова.',stay:'Проживание',today:'Сегодня',at:'в '}};
const LOC={he:'he-IL',en:'en-GB',es:'es-ES',fr:'fr-FR',de:'de-DE',ru:'ru-RU'};
let lang='en';try{lang=localStorage.getItem('guideLang')||''}catch(e){}
if(!T[lang]){const n=(navigator.language||'en').slice(0,2).toLowerCase();lang=T[n]?n:'en'}
const sel=document.getElementById('lang');sel.value=lang;
sel.addEventListener('change',()=>{lang=sel.value;try{localStorage.setItem('guideLang',lang)}catch(e){}draw()});
const t=k=>(T[lang]||T.en)[k]||T.en[k]||k;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fD=(d,o)=>{try{return new Intl.DateTimeFormat(LOC[lang],o||{weekday:'short',day:'numeric',month:'short'}).format(new Date(d+'T12:00:00'))}catch(e){return d}};
const fT=ms=>{try{return new Intl.DateTimeFormat(LOC[lang],{hour:'2-digit',minute:'2-digit'}).format(new Date(ms))}catch(e){return ''}};
const fDT=ms=>{try{return new Intl.DateTimeFormat(LOC[lang],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(ms))}catch(e){return ''}};
const k=new URLSearchParams(location.search).get('k')||'';
const cfg=window.APP_CONFIG||{},pid=(cfg.firebase||{}).projectId||'hotel-shifts',API='https://europe-west1-'+pid+'.cloudfunctions.net/grpGuide';
let D=null,E=null,seen=0;try{seen=+localStorage.getItem('guideSeen:'+k)||0}catch(e){}
function draw(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';
  const m=document.getElementById('main');
  if(E){document.title=t('title');document.getElementById('t').textContent=t('title');document.getElementById('st').textContent='';
    m.innerHTML=`<div class="err"><h2 style="justify-content:center">${esc(E==='notfound'?t('bad'):E==='expired'?t('exp'):t('err'))}</h2><p class="muted">${E==='notfound'||E==='expired'?esc(t('badp')):''}</p>${E==='server'||E==='net'?`<button class="ref" id="rf">${esc(t('refresh'))}</button>`:''}</div>`;
    const b=document.getElementById('rf');if(b)b.onclick=load;return}
  if(!D)return;
  document.title=(D.name||t('title'))+' · '+(D.hotel||'');
  document.getElementById('t').textContent=D.name||t('title');
  document.getElementById('st').textContent=[D.hotel,D.ci&&D.co?t('stay')+': '+fD(D.ci,{day:'numeric',month:'short'})+' – '+fD(D.co,{day:'numeric',month:'short'}):''].filter(Boolean).join(' · ');
  const R=D.rooms||[],n=s=>R.filter(x=>x.st===s).length;
  const rooms=`<section class="card" aria-labelledby="hr"><h2 id="hr">${esc(t('rooms'))}<small>${esc(t('today'))} · ${esc(fD(D.day))}</small></h2>
    ${R.length?`<div class="kpis"><div class="kpi"><b>${n('clean')}</b><span>${esc(t('cleaned'))}</span></div><div class="kpi"><b>${n('busy')}</b><span>${esc(t('busy'))}</span></div><div class="kpi"><b>${n('wait')}</b><span>${esc(t('wait'))}</span></div><div class="kpi"><b>${R.length}</b><span>${esc(t('total'))}</span></div></div>
    <div class="rooms">${R.map(x=>`<div class="room s-${x.st}"><b>${esc(x.r)}</b><span>${esc(t('st_'+x.st))}</span>${x.at&&(x.st==='clean'||x.st==='busy')?`<small>${esc(t('at'))}${esc(fT(x.at))}</small>`:''}</div>`).join('')}</div>`:`<p class="muted">${esc(t('norooms'))}</p>`}</section>`;
  const msgs=`<section class="card" aria-labelledby="hm"><h2 id="hm">${esc(t('msgs'))}</h2>${(D.msgs||[]).length?`<div class="list">${D.msgs.map(x=>`<div class="msg ${x.at>seen?'new':''}"><p dir="auto">${esc(x.text)}</p><small>${esc(fDT(x.at))}${x.by?' · '+esc(x.by):''}</small></div>`).join('')}</div>`:`<p class="muted">${esc(t('nomsgs'))}</p>`}</section>`;
  let last='',hl='';(D.halls||[]).forEach(x=>{if(x.date!==last){hl+=`<div class="day">${esc(fD(x.date))}</div>`;last=x.date}
    hl+=`<div class="row"><b dir="auto">${esc(x.place)}</b><small>${esc(x.start)}–${esc(x.end)}${x.guests?' · '+x.guests+' '+esc(t('people')):''}${x.note?' · <span dir="auto">'+esc(x.note)+'</span>':''}</small></div>`});
  const halls=`<section class="card" aria-labelledby="hh"><h2 id="hh">${esc(t('halls'))}</h2>${hl?`<div class="list">${hl}</div>`:`<p class="muted">${esc(t('nohalls'))}</p>`}</section>`;
  m.innerHTML=msgs+rooms+halls+`<p class="foot">${esc(t('upd'))} ${esc(fT(D.now||Date.now()))} · <button class="ref" id="rf">${esc(t('refresh'))}</button><br>${esc(D.chain||'')}</p>`;
  document.getElementById('rf').onclick=load;
}
async function load(){
  if(!/^g[0-9a-f]{32}$/.test(k)){E='notfound';draw();return}
  try{const r=await fetch(API+'?k='+encodeURIComponent(k),{cache:'no-store'});const j=await r.json().catch(()=>({}));
    if(!r.ok){E=j.error||'server';D=null}else{E=null;D=j;const top=Math.max(0,...(j.msgs||[]).map(x=>x.at||0));draw();if(top){try{localStorage.setItem('guideSeen:'+k,String(top))}catch(e){}}return}}
  catch(e){if(!D)E='net'}
  draw()}
load();setInterval(()=>{if(!document.hidden)load()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script>
</body>
</html>
