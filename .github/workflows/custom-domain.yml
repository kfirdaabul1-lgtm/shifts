name: Custom domain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/custom-domain.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DOMAIN: app.sevencollection.co.il
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Firebase authorised domain + appUrl
        env:
          KEY: ${{ secrets.FIREBASE_DEPLOY_KEY }}
        run: |
          cd functions && npm install --omit=dev --silent
          echo "$KEY" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          node auth-domain.js "$DOMAIN"
          node set-appurl.js "https://$DOMAIN/"
          rm -f "$RUNNER_TEMP/key.json"
