name: PMS bookings check
on:
  workflow_dispatch:
    inputs:
      clean: { description: '1 = delete incomplete AI bookings', required: false, default: '0' }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd functions && npm install --omit=dev
      - env:
          KEY: ${{ secrets.FIREBASE_DEPLOY_KEY }}
          CLEAN: ${{ inputs.clean }}
          
        run: |
          echo "$KEY" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          cd functions && node pms-check.js
          rm -f "$RUNNER_TEMP/key.json"
