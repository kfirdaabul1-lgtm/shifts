<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group guide</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E7;--card:#FFFDF8;--ink:#1B2336;--muted:#6B6457;--line:#E4DBC8;--navy:#14213D;--gold:#B08D57;--ok:#1F7A4D;--okb:#E3F3EA;--warn:#9A5B00;--warnb:#FFF1D6;--bad:#B3261E;--badb:#FBE4E2;--busy:#1D4ED8;--busyb:#E3ECFF;--grey:#555;--greyb:#ECEAE6}
@media (prefers-color-scheme:dark){:root{--bg:#0E1626;--card:#16213A;--ink:#EEE8DC;--muted:#A9A190;--line:#2A3858;--okb:#14382A;--warnb:#3A2B10;--badb:#3D1715;--busyb:#172A55;--greyb:#2A2F3A;--ok:#6FD3A0;--warn:#F5C26B;--bad:#FF8A80;--busy:#93B4FF;--grey:#C9C4BA}}
*{box-sizing:border-box}
body{margin:0;font-family:Assistant,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px}
.top{background:var(--navy);color:#F6F1E7;padding:18px 16px 16px}
.top .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.top h1{font-family:'Frank Ruhl Libre',serif;font-size:26px;margin:0;line-height:1.2}
.top p{margin:4px 0 0;color:#D9CDB4;font-size:14px}
.top select{background:transparent;color:#F6F1E7;border:1px solid var(--gold);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px}
.top select option{color:#1B2336}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}
h2{font-family:'Frank Ruhl Libre',serif;font-size:20px;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 small{font-family:Assistant,Arial,sans-serif;font-size:14px;color:var(--muted);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;border-top:3px solid var(--gold)}
.kpi b{display:block;font-size:22px;font-family:'Frank Ruhl Libre',serif}.kpi span{font-size:13px;color:var(--muted)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.room{position:relative;border-radius:8px;padding:8px 10px;border:1px solid var(--line)}.room em .cat{display:inline;font-size:12px;font-weight:700}button.ref.wa{background:#25D366;border-color:#1DA851;color:#fff;font-weight:700;padding:10px 16px}.room i{display:block;font-style:normal;font-size:12px;margin-top:3px;line-height:1.3;word-break:break-word}
.rplus{position:absolute;top:5px;inset-inline-end:5px;width:30px;height:30px;border-radius:50%;border:1px solid currentColor;background:var(--card);color:inherit;font:inherit;font-size:18px;line-height:1;cursor:pointer;padding:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.ov .gr{background:var(--card,#fff);color:var(--ink);width:100%;max-width:420px;max-height:90vh;overflow:auto}
.room b{display:block;font-size:18px}.room em{display:block;font-style:normal;font-size:12px;margin-top:2px}
.gst{display:flex;flex-direction:column;gap:8px}.gr{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.gr-h{display:flex;align-items:center;gap:8px;justify-content:space-between}.gr-h b{font-size:17px}.gr-n{font-size:14px;margin-top:4px}.gr input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:6px;margin-top:6px;background:transparent;color:var(--ink)}.gr .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.gr .note{font-size:13px}.room span{font-size:13px;font-weight:600}.room small{display:block;font-size:12px;opacity:.8}
.s-clean{background:var(--okb);color:var(--ok);border-color:transparent}
.s-ready{background:var(--okb);color:var(--ok);border-color:transparent;opacity:.85}
.s-busy{background:var(--busyb);color:var(--busy);border-color:transparent}
.s-wait{background:var(--warnb);color:var(--warn);border-color:transparent}
.s-dnd,.s-oos{background:var(--greyb);color:var(--grey);border-color:transparent}
.s-fault{background:var(--badb);color:var(--bad);border-color:transparent}
.list{display:grid;gap:8px}
.row{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.row b{display:block}.row small{color:var(--muted)}
.day{font-weight:700;margin:10px 0 4px;color:var(--muted);font-size:14px}
.msg{border-inline-start:4px solid var(--gold);background:var(--card);border-radius:8px;padding:10px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line)}
.msg p{margin:0;white-space:pre-wrap}.msg small{color:var(--muted);display:block;margin-top:4px}
.msg.new{box-shadow:0 0 0 2px var(--gold)}
.muted{color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
button.ref{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.err{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;text-align:center;margin-top:30px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fD=(d,o)=>{try{return new Intl.DateTimeFormat(LOC[lang],o||{weekday:'short',day:'numeric',month:'short'}).format(new Date(d+'T12:00:00'))}catch(e){return d}};
const fT=ms=>{try{return new Intl.DateTimeFormat(LOC[lang],{hour:'2-digit',minute:'2-digit'}).format(new Date(ms))}catch(e){return ''}};
const fDT=ms=>{try{return new Intl.DateTimeFormat(LOC[lang],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(ms))}catch(e){return ''}};
const k=new URLSearchParams(location.search).get('k')||'';
const cfg=window.APP_CONFIG||{},pid=(cfg.firebase||{}).projectId||'hotel-shifts',API='https://europe-west1-'+pid+'.cloudfunctions.net/grpGuide';
let D=null,E=null,seen=0,ED='',EDV=null,EDM='',OK='',PF=null,PDIRTY=false,PERR='',PBUSY=false,JUST=false;try{seen=+localStorage.getItem('guideSeen:'+k)||0}catch(e){}
function draw(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';
  const m=document.getElementById('main');
  if(E){document.title=t('title');document.getElementById('t').textContent=t('title');document.getElementById('st').textContent='';
    m.innerHTML=`<div class="err"><h2 style="justify-content:center">${esc(E==='notfound'?t('bad'):E==='expired'?t('exp'):t('err'))}</h2><p class="muted">${E==='notfound'||E==='expired'?esc(t('badp')):''}</p>${E==='server'||E==='net'?`<button class="ref" id="rf">${esc(t('refresh'))}</button>`:''}</div>`;
    const b=document.getElementById('rf');if(b)b.onclick=load;return}
  if(!D)return;
  if(D.mode==='pre'){drawPre(m);return}
  document.title=(D.name||t('title'))+' · '+(D.hotel||'');
  document.getElementById('t').textContent=D.name||t('title');
  document.getElementById('st').textContent=[D.hotel,D.ci&&D.co?t('stay')+': '+fD(D.ci,{day:'numeric',month:'short'})+' – '+fD(D.co,{day:'numeric',month:'short'}):''].filter(Boolean).join(' · ');
  const R=D.rooms||[],n=s=>R.filter(x=>x.st===s).length,ciDay=!!D.ci&&D.day<=D.ci;
  const rooms=`<section class="card" aria-labelledby="hr"><h2 id="hr">${esc(t('rooms'))}<small>${esc(t('today'))} · ${esc(fD(D.day))}</small></h2>
    ${R.length&&!ciDay?`<div class="kpis"><div class="kpi"><b>${n('clean')}</b><span>${esc(t('cleaned'))}</span></div><div class="kpi"><b>${n('busy')}</b><span>${esc(t('busy'))}</span></div><div class="kpi"><b>${n('wait')}</b><span>${esc(t('wait'))}</span></div>${n('dnd')?`<div class="kpi"><b>${n('dnd')}</b><span>🚫 ${esc(t('dndn'))}</span></div>`:''}<div class="kpi"><b>${R.length}</b><span>${esc(t('total'))}</span></div></div>`:''}${R.length?`
    <div class="rooms">${R.map(x=>{const nm=(x.names||[]).filter(Boolean);return `<div class="room s-${ciDay?'list':x.st}"><button class="rplus" data-ge="${esc(x.r)}" aria-label="${esc(t(nm.length?'edit':'addn'))} ${esc(x.r)}">${nm.length?'✎':'+'}</button><b>${esc(x.r)}</b>${x.cat||x.pax?`<em>${x.cat?`<b class="cat">${esc(t('c_'+x.cat))}</b> `:''}${x.pax?`👤 ${x.pax}`:''}</em>`:''}${ciDay||x.st==='list'?'':`<span>${esc(t('st_'+x.st))}</span>`}${!ciDay&&x.at&&(x.st==='clean'||x.st==='busy')?`<small>${esc(t('at'))}${esc(fT(x.at))}</small>`:x.at&&x.st==='dnd'?`<small>🚫 ${esc(t('since'))}${esc(fT(x.at))}</small>`:''}${nm.length?`<i dir="auto">${nm.map(esc).join(', ')}</i>`:''}${OK===x.r?`<small>✓ ${esc(t('saved'))}</small>`:''}</div>`}).join('')}</div><p style="margin:12px 0 0"><button class="ref wa" id="wash">💬 ${esc(t('wash'))}</button></p>`:`<p class="muted">${esc(t('norooms'))}</p>`}</section>`;
  const ex=ED&&R.find(x=>x.r===ED);let gst='';
  if(ex){const c=ex.pax||0,v=EDV||[],n=Math.max(c,v.length,1);let inp='';for(let i=0;i<n;i++)inp+=`<input type="text" dir="auto" maxlength="60" data-gi="${i}" value="${esc(v[i]||'')}" placeholder="${esc(t('gname'))} ${i+1}" aria-label="${esc(t('gname'))} ${i+1}">`;
    gst=`<div class="ov" role="dialog" aria-modal="true" aria-labelledby="ovh"><div class="gr"><div class="gr-h"><b id="ovh">${esc(ex.r)}${ex.cat?` <small>· ${esc(t('c_'+ex.cat))}</small>`:''}</b>${c?`<small>👤 ${c} ${esc(t('guests'))}</small>`:''}</div><p class="note">${esc(t('gsth'))}</p>${inp}<div class="acts">${n<12?`<button class="ref" data-ga="add">${esc(t('addn'))}</button>`:''}<button class="ref" data-ga="save" style="font-weight:700">${esc(t('save'))}</button><button class="ref" data-ga="cancel">${esc(t('cancel'))}</button></div>${EDM?`<p class="note">${esc(EDM)}</p>`:''}</div></div>`}
  const msgs=`<section class="card" aria-labelledby="hm"><h2 id="hm">${esc(t('msgs'))}</h2>${(D.msgs||[]).length?`<div class="list">${D.msgs.map(x=>`<div class="msg ${x.at>seen?'new':''}"><p dir="auto">${esc(x.text)}</p><small>${esc(fDT(x.at))}${x.by?' · '+esc(x.by):''}</small></div>`).join('')}</div>`:`<p class="muted">${esc(t('nomsgs'))}</p>`}</section>`;
  const ml=(D.meals||[]);const meals=ml.length?`<section class="card" aria-labelledby="hml"><h2 id="hml">${esc(t('meals'))}</h2><div class="list">${ml.map(x=>`<div class="row"><b>${esc(t('m_'+x.k))}</b><small>${esc(x.f)}${x.t?'–'+esc(x.t):''}${x.place?' · <span dir="auto">'+esc(x.place)+'</span>':''}</small></div>`).join('')}</div></section>`:'';
  let last='',hl='';(D.halls||[]).forEach(x=>{if(x.date!==last){hl+=`<div class="day">${esc(fD(x.date))}</div>`;last=x.date}
    hl+=`<div class="row"${x.past?' style="opacity:.55"':''}><b dir="auto">${esc(x.place)}${x.past?' <small>· '+esc(t('past'))+'</small>':''}</b><small>${esc(x.start)}–${esc(x.end)}${x.guests?' · '+x.guests+' '+esc(t('people')):''}${x.note?' · <span dir="auto">'+esc(x.note)+'</span>':''}</small></div>`});
  const halls=`<section class="card" aria-labelledby="hh"><h2 id="hh">${esc(t('halls'))}</h2>${hl?`<div class="list">${hl}</div>`:`<p class="muted">${esc(t('nohalls'))}</p>`}</section>`;
  let pc='';if(D.pre&&(!D.pre.prefAt||JUST)){if(PF===null||(!D.pre.prefAt&&!JUST))PF=!D.pre.prefAt;pc=preCard(D.pre,true)}
  m.innerHTML=pc+msgs+meals+rooms+halls+gst+`<p class="foot">${esc(t('upd'))} ${esc(fT(D.now||Date.now()))} · <button class="ref" id="rf">${esc(t('refresh'))}</button><br>${esc(D.chain||'')}</p>`;
  document.getElementById('rf').onclick=load;
  if(pc)preBind(m,D.pre);
  const wb=document.getElementById('wash');if(wb)wb.onclick=()=>{const L=(D.rooms||[]).map(x=>{const nm=(x.names||[]).filter(Boolean);return '• '+t('room')+' '+x.r+(x.cat?' ('+t('c_'+x.cat)+')':'')+(x.pax?' · 👤'+x.pax:'')+(nm.length?'\n   '+nm.join(', '):'')});
    const txt=(D.name||'')+(D.hotel?' · '+D.hotel:'')+'\n'+t('walist')+':\n'+L.join('\n');location.href='https://wa.me/?text='+encodeURIComponent(txt)};
  m.querySelectorAll('[data-ge]').forEach(b=>b.onclick=()=>{const x=(D.rooms||[]).find(y=>y.r===b.dataset.ge);ED=b.dataset.ge;EDV=((x&&x.names)||[]).slice();EDM='';OK='';draw();const i=m.querySelector('[data-gi]');if(i)i.focus()});
  const rd=()=>[...m.querySelectorAll('[data-gi]')].map(i=>i.value);
  m.querySelectorAll('[data-ga]').forEach(b=>b.onclick=async()=>{const a=b.dataset.ga;
    if(a==='cancel'){ED='';EDV=null;draw();return}
    if(a==='add'){EDV=rd();EDV.push('');draw();const L=m.querySelectorAll('[data-gi]');if(L.length)L[L.length-1].focus();return}
    EDV=rd();b.disabled=true;
    try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({k,room:ED,names:EDV})});const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok)throw 0;const x=(D.rooms||[]).find(y=>y.r===ED);if(x)x.names=j.names||[];OK=ED;ED='';EDV=null;EDM='';draw();setTimeout(()=>{if(OK){OK='';if(!ED)draw()}},4000)}
    catch(e){EDM=t('nsaved');b.disabled=false;draw()}});
}
function preCard(P,stay){const ML=P.meals||[],PR=P.pref||{};
  if(!PF)return `<section class="card" aria-labelledby="hp"><h2 id="hp">✓ ${esc(t('pre_okt'))}</h2><p>${esc(t('pre_ok'))}</p>
    ${ML.some(x=>PR[x.k])?`<h3 style="font-size:16px;margin:12px 0 6px">${esc(t('pre_your'))}</h3><div class="list">${ML.filter(x=>PR[x.k]).map(x=>`<div class="row"><b>${esc(t('m_'+x.k))}</b><small dir="ltr">${esc(PR[x.k])}</small></div>`).join('')}</div>`:''}
    ${P.note?`<p class="muted" dir="auto" style="white-space:pre-wrap">${esc(P.note)}</p>`:''}
    <p class="muted">${esc(t('pre_eff'))}</p>${stay?'':`<button class="ref" id="pupd">${esc(t('pre_upd'))}</button>`}</section>`;
  return `<section class="card" aria-labelledby="hp" style="border-top:3px solid var(--gold)"><h2 id="hp">${esc(t('pre_t'))}</h2><p>${esc(t('pre_hi').replace('{g}',P.guide?' '+P.guide:''))}</p>
    ${ML.length?`<h3 style="font-size:16px;margin:12px 0 4px">${esc(t('pre_m'))}</h3><p class="muted" style="margin:0 0 8px">${esc(t('pre_eff'))}</p><div class="list">${ML.map(x=>`<div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><label for="pm_${x.k}"><b>${esc(t('m_'+x.k))}</b>${x.f?`<small>${esc(t('pre_htl'))} ${esc(x.f)}${x.t?'–'+esc(x.t):''}</small>`:''}</label><input id="pm_${x.k}" type="time" data-pm="${x.k}" value="${esc(PR[x.k]||'')}" style="font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);min-width:120px"></div>`).join('')}</div>`:`<p class="muted">${esc(t('pre_none'))}</p>`}
    <label for="pnote" style="display:block;margin-top:12px;font-weight:600">${esc(t('pre_note'))}</label><textarea id="pnote" maxlength="500" rows="3" dir="auto" placeholder="${esc(t('pre_noteph'))}" style="width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);margin-top:4px">${esc(P.note||'')}</textarea>
    ${PERR?`<p style="color:var(--bad);font-weight:600" role="alert">${esc(PERR)}</p>`:''}
    <p style="margin:12px 0 0"><button class="ref wa" id="psend" ${PBUSY?'disabled':''}>${esc(t('send'))}</button></p></section>`}
function preBind(m,P){const ML=P.meals||[];
  const u=document.getElementById('pupd');if(u)u.onclick=()=>{PF=true;PDIRTY=false;PERR='';draw()};
  m.querySelectorAll('[data-pm],#pnote').forEach(i=>i.addEventListener('input',()=>{PDIRTY=true}));
  const b=document.getElementById('psend');if(b)b.onclick=async()=>{
    const pref={};m.querySelectorAll('[data-pm]').forEach(i=>{if(i.value)pref[i.dataset.pm]=i.value});const note=(document.getElementById('pnote')||{}).value||'';
    if(ML.length&&!Object.keys(pref).length){PERR=t('pre_need');draw();return}
    PBUSY=true;PERR='';b.disabled=true;
    try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({k,op:'pre',pref,note})});const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok)throw 0;P.pref=j.pref||pref;P.note=j.note||'';P.prefAt=Date.now();PF=false;PDIRTY=false;JUST=true}
    catch(e){PERR=t('nsaved')}
    PBUSY=false;draw();window.scrollTo(0,0)};
}
function drawPre(m){
  document.title=(D.name||t('pre_t'))+' · '+(D.hotel||'');
  document.getElementById('t').textContent=D.name||t('pre_t');
  document.getElementById('st').textContent=[D.hotel,D.ci&&D.co?t('stay')+': '+fD(D.ci,{day:'numeric',month:'short'})+' – '+fD(D.co,{day:'numeric',month:'short'}):''].filter(Boolean).join(' · ');
  if(PF===null)PF=!D.prefAt;
  m.innerHTML=preCard(D,false)+`<p class="foot">${esc(D.chain||'')}</p>`;preBind(m,D);
}
async function load(){
  if(!/^g[0-9a-f]{32}$/.test(k)){E='notfound';draw();return}
  try{const r=await fetch(API+'?k='+encodeURIComponent(k),{cache:'no-store'});const j=await r.json().catch(()=>({}));
    if(!r.ok){E=j.error||'server';D=null}else{E=null;if(D&&(PDIRTY||PBUSY)&&(j.mode==='pre'||j.pre))return;if(JUST&&j.pre&&D&&D.pre)j.pre=Object.assign({},j.pre,{prefAt:j.pre.prefAt||D.pre.prefAt});D=j;const top=Math.max(0,...(j.msgs||[]).map(x=>x.at||0));if(!ED)draw();if(top){try{localStorage.setItem('guideSeen:'+k,String(top))}catch(e){}}return}}
  catch(e){if(!D)E='net'}
  draw()}
load();setInterval(()=>{if(!document.hidden)load()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script>
</body>
</html>
