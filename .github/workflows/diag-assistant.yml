name: Diag assistant (temporary)
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd functions && npm install --omit=dev >/dev/null 2>&1
      - env: { KEY: "${{ secrets.FIREBASE_DEPLOY_KEY }}" }
        run: |
          echo "$KEY" > "$RUNNER_TEMP/k.json"; export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/k.json"
          cd functions && node -e "
          const admin=require('firebase-admin');(async()=>{const {access_token:t}=await admin.credential.applicationDefault().getAccessToken();
          const r=await (await fetch('https://logging.googleapis.com/v2/entries:list',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({resourceNames:['projects/hotel-shifts'],filter:'resource.labels.function_name=\"assistant\" AND timestamp>=\"2026-11-06T12:00:00Z\"',orderBy:'timestamp desc',pageSize:30})})).json();
          if(r.error)console.log('ERR',r.error.message);(r.entries||[]).forEach(e=>console.log(e.timestamp,e.severity,String(e.textPayload||JSON.stringify(e.jsonPayload||'')).slice(0,400)));})()"
          rm -f "$RUNNER_TEMP/k.json"
