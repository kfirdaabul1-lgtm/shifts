name: Build language files
on:
  push:
    branches: [main]
    paths: ['i18n.js', 'tools/build-lang.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/build-lang.js
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain lang.js lang index.html events.html)" ]; then
            git config user.name "lang-bot"; git config user.email "lang-bot@users.noreply.github.com"
            git add lang.js lang index.html events.html
            git commit -m "Rebuild language files from i18n.js"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          else echo "language files up to date"; fi
