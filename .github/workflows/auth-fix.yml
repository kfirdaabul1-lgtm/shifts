name: Auth fix (temporary)
on:
  workflow_dispatch:
    inputs:
      hash: { description: 'sha256 of the e-mail', required: true }
      del: { description: '1 = delete when no docs', required: false, default: '0' }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd functions && npm install --omit=dev
      - env:
          KEY: ${{ secrets.FIREBASE_DEPLOY_KEY }}
          HASH: ${{ inputs.hash }}
          DO_DELETE: ${{ inputs.del }}
        run: |
          echo "$KEY" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          cd functions && node auth-fix.js
          rm -f "$RUNNER_TEMP/key.json"
