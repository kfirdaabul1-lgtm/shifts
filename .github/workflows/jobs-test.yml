name: Jobs leads test
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd functions && npm install --omit=dev
      - env:
          KEY: ${{ secrets.FIREBASE_DEPLOY_KEY }}
          
        run: |
          echo "$KEY" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          cd functions && node jobs-test.js
          rm -f "$RUNNER_TEMP/key.json"
