<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>אישור וחתימה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;500;600;700&display=swap">
<style>
/* Paper styles below are copied from events.html (.doc rules) by the build script — keep in sync */
:root{--paper:#fff;--paper-ink:#1d2230;--paper-muted:#666b78;--paper-line:#e4e1da;--f-display:"Frank Ruhl Libre","David Libre",Georgia,serif;--f-body:"Assistant","Segoe UI",Arial,sans-serif;--vt:#1f5f6b;--vtSoft:#e2eef0;--accent:#1f5f6b;--ok:#2f7a4a;--bad:#a3354a}
*{box-sizing:border-box}
body{margin:0;background:#f3f2ef;color:#1d2230;font-family:var(--f-body);padding:16px 12px 40px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.paper{background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.07);overflow:hidden}
.box{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 6px 24px rgba(0,0,0,.07);display:flex;flex-direction:column;gap:12px}
.box h2{margin:0;font-family:var(--f-display);font-size:22px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:#555}
input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid #ccc;border-radius:8px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.5}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
.pad{position:relative;border:1.5px dashed #bbb;border-radius:10px;background:#fff;height:200px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block}
.pad .hint{position:absolute;inset:auto 0 8px 0;text-align:center;color:#9a968c;font-size:13px;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:16px;border-radius:8px;padding:12px 18px;border:1px solid #ccc;background:#fff;cursor:pointer}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent);flex:1;font-weight:700}
button:disabled{opacity:.6}
.msg{padding:14px 16px;border-radius:10px;font-size:16px;line-height:1.6}
.ok{background:#e6f4ea;color:#1e6b34}.err{background:#fdecea;color:#a3354a}
.center{text-align:center;color:#666;margin-top:40px}
.sigshow img{max-width:320px;width:100%;border:1px solid #ddd;border-radius:8px;background:#fff}
@media print{body{background:#fff;padding:0}.box,.noprint{display:none!important}.paper{box-shadow:none}}
.doc{background:var(--paper);color:var(--paper-ink);font-family:var(--f-body);padding:40px 44px;min-width:0;direction:rtl;font-size:14px;line-height:1.55}
.doc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.doc .biz{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.2}
.doc .biz.sm{font-size:17px}
.doc .blogo{display:block;height:46px;width:auto;max-width:220px;object-fit:contain;object-position:right;margin-bottom:10px}
.doc .klogo{display:block;height:38px;width:auto;max-width:200px;margin:0 auto 12px;object-fit:contain}
.doc .bizc{color:var(--paper-muted);font-size:13px}
.doc .ttl{text-align:left}
.doc .dhead{text-align:center;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--paper-line)}
.doc .hlogo{display:block;width:auto;max-width:240px;margin:0 auto;object-fit:contain}
.doc .hname{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.doc .dtype{margin-top:8px;font-size:13px;letter-spacing:.04em;color:var(--paper-muted);font-weight:600}
.doc .dtype.order{color:var(--vt);font-weight:700}
.doc .ttl div{font-size:13px;color:var(--paper-muted);font-variant-numeric:tabular-nums}
.doc .vband{margin-block:22px 18px;padding:12px 16px;border-right:6px solid var(--vt);background:var(--vtSoft)}
.doc .vband b{font-family:var(--f-display);font-size:20px;display:block}
.doc .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:18px}
.doc .lbl{font-size:12px;font-weight:700;color:var(--paper-muted);margin-bottom:4px}
.doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.doc th{font-size:12px;color:var(--paper-muted);text-align:right;font-weight:700;border-bottom:2px solid var(--paper-ink);padding:6px 4px}
.doc td{padding:8px 4px;border-bottom:1px solid var(--paper-line);vertical-align:top}
.doc .n{text-align:left;white-space:nowrap}
.doc .tot{margin-top:14px;margin-right:auto;width:min(300px,100%);font-variant-numeric:tabular-nums}
.doc .tot div{display:flex;justify-content:space-between;padding:3px 0}
.doc .tot .g{border-top:2px solid var(--paper-ink);margin-top:6px;padding-top:8px;font-size:18px;font-weight:700}
.doc .notes{margin-top:22px;font-size:13px;white-space:pre-wrap}
.doc .sign{margin-top:34px;display:flex;gap:30px;flex-wrap:wrap;font-size:13px;color:var(--paper-muted)}
.doc .sign span{border-top:1px solid var(--paper-ink);padding-top:4px;min-width:150px;display:inline-block}
.doc .empty{color:var(--paper-muted);text-align:center;padding:16px}
@media (max-width:560px){.doc{padding:22px 18px}.doc .two{grid-template-columns:1fr}.doc .ttl{text-align:right}}
.doc .sigimg{display:block;height:64px;max-width:220px;object-fit:contain;margin-bottom:2px}
.doc .signed{color:var(--paper-ink);font-weight:600}
.doc .mhead{text-align:center;padding-top:14px}
.doc .mt{font-family:var(--f-display);font-size:34px;font-weight:500;line-height:1.2}
.doc .ms{color:var(--vt);font-size:19px;margin-top:6px}
.doc .mrule{border:0;border-top:2px solid var(--vt);margin:22px 0 10px;opacity:.75}
.doc .msec{margin-top:22px}
.doc .msh{color:var(--vt);font-weight:700;font-size:17px;padding-bottom:6px;border-bottom:1px solid var(--paper-line);margin-bottom:10px}
.doc .mnote{font-style:italic;color:var(--paper-muted);font-size:13px;margin-bottom:6px}
.doc .mi{margin:0 0 9px;font-size:14px}
.doc .kh{font-family:var(--f-display);font-size:21px;font-weight:700;margin:22px 0 8px;color:var(--paper-ink)}
.doc .kh:first-of-type{margin-top:6px}
.doc .kh2{font-weight:700;font-size:15px;color:var(--vt);margin:14px 0 6px}
.doc .kp{margin:0 0 6px;font-size:13.5px}
.doc ul.kul{margin:0 0 6px;padding-inline-start:20px;font-size:13.5px}
.doc ul.kul li{margin-bottom:5px}
.doc hr.khr{border:0;border-top:1px solid var(--paper-line);margin:16px 0}
.doc .ktitle{text-align:center;font-family:var(--f-display);font-size:26px;font-weight:700;padding-top:6px}
.doc .ksub{text-align:center;color:var(--paper-muted);font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="center">טוען את ההצעה…</p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var CFG=window.APP_CONFIG||{},app=document.getElementById('app');
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var ils=function(n){return '₪'+(Math.round((+n||0)*100)/100).toLocaleString('he-IL')};
  var fail=function(t){app.innerHTML='<p class="center">'+esc(t)+'</p>'};
  var id=new URLSearchParams(location.search).get('k')||'';
  if(!/^s[0-9a-f]{32}$/.test(id))return fail('הקישור אינו תקין. בקשו מהעסק קישור חדש.');
  try{firebase.initializeApp(CFG.firebase)}catch(e){return fail('לא הצלחתי להתחבר.')}
  var db=firebase.firestore();
  if(window.SC_NEED_CHAIN){var cid=window.SC_NEED_CHAIN;db.doc('chains/'+cid).get().then(function(d){if(!d.exists)return fail('הקישור אינו תקין.');try{var o=d.data();o.id=cid;localStorage.setItem('scChainCfg:'+cid,JSON.stringify(o))}catch(e){}location.reload()},function(){fail('לא הצלחתי להתחבר.')});return}
  // the paper HTML is generated by the quotes app; strip anything active before showing it
  function clean(h){var d=new DOMParser().parseFromString('<div>'+String(h||'')+'</div>','text/html');
    d.querySelectorAll('script,iframe,object,embed,link,meta,form,input,button,textarea,select').forEach(function(x){x.remove()});
    d.querySelectorAll('*').forEach(function(x){[].slice.call(x.attributes).forEach(function(a){var n=a.name.toLowerCase(),v=String(a.value||'');
      if(n.indexOf('on')===0||((n==='href'||n==='src'||n==='xlink:href')&&/^\s*javascript:/i.test(v))||(n==='src'&&!/^(data:image\/|https:)/i.test(v.trim())))x.removeAttribute(a.name)})});
    return d.body.firstChild.innerHTML}
  var ref=db.doc('signs/'+id);
  ref.get().then(function(sn){
    if(!sn.exists)return fail('ההצעה לא נמצאה. בקשו מהעסק קישור חדש.');
    var s=sn.data();document.title='אישור הצעה '+(s.num||'');
    var paper='<div class="paper"><div class="doc" style="--vt:'+esc(s.vt||'#1f5f6b')+';--vtSoft:'+esc(s.vts||'#e2eef0')+'">'+clean(s.html)+'</div></div>';
    if(s.status==='signed'){app.innerHTML='<div class="msg ok">ההצעה אושרה ונחתמה על ידי '+esc(s.signName)+' ב-'+esc(s.signedAtTxt||new Date(s.signedAt).toLocaleString('he-IL'))+'. תודה!</div>'+paper+(s.sig&&/^data:image\/png;base64,/.test(s.sig)?'<div class="box sigshow"><b>חתימה</b><img src="'+s.sig+'" alt="חתימה"></div>':'');return}
    if(s.status!=='pending')return fail('הקישור כבר לא פעיל. בקשו מהעסק קישור חדש.');
    if(s.expMs&&Date.now()>s.expMs){app.innerHTML='<div class="msg err">תוקף ההצעה פג. צרו קשר עם העסק כדי לקבל הצעה מעודכנת'+(s.bizPhone?': '+esc(s.bizPhone):'')+'.</div>'+paper;return}
    app.innerHTML=paper+'<div class="box"><h2>אישור וחתימה</h2>'+
      '<label class="f">שם מלא של החותם<input type="text" id="nm" autocomplete="name" value="'+esc(s.clientName||'')+'"></label>'+
      '<label class="chk"><input type="checkbox" id="ag"><span>קראתי את ההצעה ואת התנאים ואני מאשר/ת אותה'+(s.total?' בסכום של '+ils(s.total)+' כולל מע״מ':'')+'</span></label>'+
      '<div><div style="font-size:14px;margin-bottom:4px">חתימה</div><div class="pad"><canvas id="cv"></canvas><div class="hint" id="hint">חותמים כאן עם האצבע</div></div></div>'+
      '<div class="err msg" id="er" hidden></div>'+
      '<div class="row"><button type="button" id="clr">ניקוי חתימה</button><button type="button" class="pri" id="go">אישור וחתימה</button></div></div>';
    var cv=document.getElementById('cv'),cx=cv.getContext('2d'),dirty=false,draw=false,last=null;
    function size(){var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);cx.setTransform(dpr,0,0,dpr,0,0);cx.lineWidth=2.4;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#1d2230';dirty=false;document.getElementById('hint').hidden=false}
    size();var pt=function(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
    cv.addEventListener('pointerdown',function(e){e.preventDefault();draw=true;last=pt(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}document.getElementById('hint').hidden=true});
    cv.addEventListener('pointermove',function(e){if(!draw)return;e.preventDefault();var p=pt(e);cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.stroke();last=p;dirty=true});
    ['pointerup','pointercancel'].forEach(function(t){cv.addEventListener(t,function(){draw=false})});
    document.getElementById('clr').onclick=size;
    document.getElementById('go').onclick=function(){var er=document.getElementById('er'),btn=this,name=document.getElementById('nm').value.trim();er.hidden=true;
      var bad=function(t){er.textContent=t;er.hidden=false};
      if(name.length<2)return bad('נא למלא שם מלא.');if(!document.getElementById('ag').checked)return bad('נא לסמן שקראת ואישרת את ההצעה.');if(!dirty)return bad('נא לחתום במסגרת.');
      var w=Math.min(600,cv.width),h=Math.round(cv.height*w/cv.width),o=document.createElement('canvas');o.width=w;o.height=h;var oc=o.getContext('2d');oc.fillStyle='#fff';oc.fillRect(0,0,w,h);oc.drawImage(cv,0,0,w,h);
      btn.disabled=true;btn.textContent='שולח…';
      ref.update({status:'signed',signName:name.slice(0,90),sig:o.toDataURL('image/png'),signedAt:Date.now(),agree:true,ua:String(navigator.userAgent||'').slice(0,200)}).then(function(){
        app.innerHTML='<div class="msg ok">תודה '+esc(name)+'! ההצעה אושרה ונחתמה. העתק נשמר אצל העסק, ונחזור אליכם בהקדם.</div>'+paper;window.scrollTo(0,0)
      },function(e){btn.disabled=false;btn.textContent='אישור וחתימה';bad('השליחה נכשלה. ייתכן שהקישור כבר נחתם או פג תוקפו. נסו לרענן את הדף.')})};
  },function(){fail('לא הצלחתי לטעון את ההצעה. בדקו את החיבור לאינטרנט ונסו שוב.')});
})();
</script>
</body>
</html>
