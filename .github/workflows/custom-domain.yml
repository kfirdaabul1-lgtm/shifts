name: Custom domain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/custom-domain.yml']
permissions:
  contents: read
  pages: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DOMAIN: app.sevencollection.co.il
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: DNS check (waits up to 20 min)
        run: |
          for i in $(seq 1 40); do C=$(dig +short @8.8.8.8 $DOMAIN CNAME); [ -n "$C" ] && break; sleep 30; done
          echo "::notice title=DNS CNAME::cname=[$C] A=[$(dig +short @8.8.8.8 $DOMAIN A | tr '\n' ' ')] ns=[$(dig +short NS sevencollection.co.il | tr '\n' ' ')] auth=[$(dig +short $DOMAIN CNAME @$(dig +short NS sevencollection.co.il | head -1) )]"
          echo "::notice title=Pages health::$(curl -sI http://$DOMAIN/shifts/ | head -3 | tr '\r\n' '  ')"
