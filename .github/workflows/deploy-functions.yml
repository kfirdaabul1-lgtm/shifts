name: Deploy notification functions
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firebase.json', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:
    inputs:
      only:
        description: 'What to deploy (default: all functions), e.g. functions:adsDaily,functions:adsWeekly'
        required: false
        default: ''
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: cd functions && npm install --omit=dev
      - name: Deploy to Firebase
        env:
          KEY: ${{ secrets.FIREBASE_DEPLOY_KEY }}
          ONLY: ${{ inputs.only }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$KEY" ]; then echo "Secret FIREBASE_DEPLOY_KEY is missing"; exit 1; fi
          echo "$KEY" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          TARGET="${ONLY:-functions}"
          # a push whose commit message has [ads-only] deploys only the paid-advertising agent
          case "$MSG" in *"[ads-only]"*) TARGET="functions:adsDaily,functions:adsWeekly,functions:adsRunNow,functions:adsAgent,functions:adsJob";; esac
          # [only:functions:a,functions:b] in the commit message deploys just those (fewer deploys = no "Quota Exceeded")
          if [[ "$MSG" =~ \[only:([A-Za-z0-9:,_-]+)\] ]]; then TARGET="${BASH_REMATCH[1]}"; fi
          echo "Deploying: $TARGET"
          set +e
          npx -y firebase-tools@13 deploy --only "$TARGET" --project hotel-shifts --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/out.txt"
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            { tail -n 40 "$RUNNER_TEMP/out.txt"; [ -f firebase-debug.log ] && grep -iE 'error|denied|permission|requires|enable' firebase-debug.log | tail -n 25; } > "$RUNNER_TEMP/err.txt"
            msg=$(sed 's/%/%25/g' "$RUNNER_TEMP/err.txt" | cut -c1-400 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Deploy failed::$msg"
          fi
          if [ "$rc" = "0" ]; then (cd functions && node backfill.js; node check-backup.js; node enable-ai.js; node enable-assistant.js); fi
          rm -f "$RUNNER_TEMP/key.json"
          exit $rc
