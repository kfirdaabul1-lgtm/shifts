name: groups import
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'keygen, dry or go', required: true, default: 'dry' }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd functions && npm install --omit=dev
      - env:
          KEY: ${{ secrets.FIREBASE_DEPLOY_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          echo "$KEY" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          cd functions && node grp-import.js
          rm -f "$RUNNER_TEMP/key.json"
